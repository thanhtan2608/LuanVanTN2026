# ==========================================
# 1. THONG TIN UNG DUNG & SERVER
# ==========================================
spring.application.name=LV_be
server.port=8080

# Cau hinh mui gio mac dinh cho toan he thong (Rat quan trong cho chuc nang dat lich)
spring.jackson.time-zone=Asia/Ho_Chi_Minh

# ==========================================
# 2. KET NOI DATABASE (MySQL)
# ==========================================
# Ten database la hair_salon_db nhu file SQL da chay
spring.datasource.url=jdbc:mysql://localhost:3306/hair_salon_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=root
# Loi khuyen: Dung go mat khau that len Git. Dung bien moi truong ${DB_PASSWORD}, neu khong co thi mac dinh la chuoi trang hoac 'root'
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# 3. CAU HINH JPA / HIBERNATE
# ==========================================
# 'update': Spring tu dong update cac cot neu Entity thay doi (Dung khi dang code)
# Chu y: Khi day len server that (Production), PHAI doi thanh 'validate' hoac 'none'
spring.jpa.hibernate.ddl-auto=update

# Bat log de xem cau lenh SQL chay ngam (Giup debug loi N+1 Query)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Khai bao ro engine de toi uu MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# ==========================================
# 4. CAU HINH BAO MAT JWT (JSON Web Token)
# ==========================================
# Khoa bao mat dung de ky Token (Phai la chuoi dai va kho doan).
# Thuc te nen dua vao bien moi truong ${JWT_SECRET}
jwt.secret=DayLaMotChuoiBaoMatCucKyDaiVaPhucTapChoDuAnHairSalonLVBE123456789
# Thoi gian song cua Token (Vi du: 86400000 ms = 24 gio)
jwt.expiration=86400000

# ==========================================
# 5. CAU HINH LOGGING (Bat loi)
# ==========================================
# Cap do log cua he thong Spring
logging.level.org.springframework.web=INFO
# Cap do log cua code ban tu viet (De DEBUG de do loi)
logging.level.org.example.lv_be=DEBUG
